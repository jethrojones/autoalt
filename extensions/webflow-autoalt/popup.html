<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoAlt for Webflow</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="glass-container">
      <header>
        <div class="brand-header">
          <svg class="logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="48" height="48" rx="12" fill="#191a1f"/>
            <circle cx="24" cy="24" r="14" stroke="#4353ff" stroke-width="2"/>
            <path d="M18 32L24 20L30 32" stroke="#4299e1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M19.5 28H28.5" stroke="#63b3ed" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <div class="title-meta">
            <h1>AutoAlt</h1>
            <span class="badge">Webflow Designer</span>
          </div>
        </div>
      </header>

      <nav class="tabs">
        <button id="tab-settings" class="tab-btn active">Settings</button>
        <button id="tab-history" class="tab-btn">History</button>
      </nav>

      <main>
        <!-- Settings Panel -->
        <section id="panel-settings" class="panel active">
          <form id="settings-form">
            <div class="form-group">
              <label for="provider">AI Provider</label>
              <select id="provider" name="provider">
                <option value="gemini">Google Gemini (Recommended - Free Tier)</option>
                <option value="openai">OpenAI (GPT Models)</option>
              </select>
            </div>

            <div class="form-group" id="gemini-key-group">
              <label for="gemini-api-key">Gemini API Key</label>
              <div class="input-wrapper">
                <input id="gemini-api-key" name="geminiApiKey" type="password" placeholder="AIzaSy...">
                <button type="button" class="toggle-password" tabindex="-1">👁️</button>
              </div>
              <small class="help-text">Get a free key from <a href="https://aistudio.google.com/" target="_blank">Google AI Studio</a></small>
            </div>

            <div class="form-group d-none" id="openai-key-group">
              <label for="openai-api-key">OpenAI API Key</label>
              <div class="input-wrapper">
                <input id="openai-api-key" name="apiKey" type="password" placeholder="sk-proj-...">
                <button type="button" class="toggle-password" tabindex="-1">👁️</button>
              </div>
              <small class="help-text">Get an OpenAI key from the <a href="https://platform.openai.com/" target="_blank">OpenAI Developer Dashboard</a></small>
            </div>

            <div class="form-group">
              <button type="button" id="btn-test-key" class="btn btn-secondary">Test Connection</button>
              <span id="test-status" class="test-feedback"></span>
            </div>

            <hr class="separator">

            <div class="form-group">
              <label>Alt Text Style</label>
              <div class="radio-group">
                <label class="radio-label">
                  <input type="radio" name="style" value="concise" checked>
                  <div class="radio-card">
                    <span class="radio-title">Concise</span>
                    <span class="radio-desc">Objective & brief (under 120 chars)</span>
                  </div>
                </label>
                <label class="radio-label">
                  <input type="radio" name="style" value="detailed">
                  <div class="radio-card">
                    <span class="radio-title">Detailed</span>
                    <span class="radio-desc">Rich subject & background details</span>
                  </div>
                </label>
                <label class="radio-label">
                  <input type="radio" name="style" value="custom">
                  <div class="radio-card">
                    <span class="radio-title">Custom Instructions</span>
                    <span class="radio-desc">Provide specific alt text rules</span>
                  </div>
                </label>
              </div>
            </div>

            <div class="form-group d-none" id="custom-prompt-group">
              <label for="custom-prompt">Custom Prompts / Style Guidelines</label>
              <textarea id="custom-prompt" name="customPrompt" rows="3" placeholder="e.g. Focus on technical details, translate text into French, describe outfits..."></textarea>
            </div>

            <div class="action-footer">
              <button type="submit" id="btn-save" class="btn btn-primary">Save Settings</button>
              <span id="status" role="status" class="status-message"></span>
            </div>
          </form>
        </section>

        <!-- History Panel -->
        <section id="panel-history" class="panel">
          <div class="history-header">
            <h3>Recent Generations</h3>
            <button id="btn-clear-history" class="btn btn-text">Clear All</button>
          </div>
          <div id="history-list" class="history-list">
            <p class="empty-state">No alt descriptions generated yet.</p>
          </div>
        </section>
      </main>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
